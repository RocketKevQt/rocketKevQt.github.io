    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <span class="d-block d-lg-none">Kévin DIDIER</span>
                <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="assets/img/profile.jpg" alt="..." /></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#a-propos">À Propos de Moi</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#experiences">Expérience</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#formation">Formation</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#competences">Compétences</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#interets">Interêts</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#projets">Projets Universitaire et Personnels</a></li>
                    
                </ul>
            </div>
        </nav>
        <!-- Page Content-->
        <div class="container-fluid p-0">
            <hr class="m-0" />
            <section class="resume-section" id="a-propos"></section>
            <hr class="m-0" />
            <section class = "resume-section" id="experiences"></section>
            <hr class="m-0" />
            <section class="resume-section" id="formation"></section>
            <hr class="m-0" />
            <section class="resume-section" id="competences" ></section>
            <hr class="m-0" />
            <section class="resume-section" id="interets"></section>
            <hr class="m-0" />
            <section class="resume-section" id="projets"></section>

            
        </div>
          <script>
            async function includeHTML(id, file) {
            const res = await fetch(file);
            if (res.ok) {
                    document.getElementById(id).innerHTML = await res.text();
                } else {
                    console.error(`Could not load ${file}: ${res.statusText}`);
                }
            }


        async function loadAllSections() {
            await Promise.all([
                includeHTML("a-propos", "/sections/about-section.html"),
                includeHTML("experiences", "/sections/experiences-section.html"),
                includeHTML("formation", "/sections/formation-section.html"),
                includeHTML("competences", "/sections/competences-section.html"),
                includeHTML("interets", "/sections/interests-section.html"),
                includeHTML("projets", "/sections/projects-section.html")
            ]);

            const downloadButton = document.getElementById("download");
            downloadButton.disabled = false;
            downloadButton.addEventListener("click", () => {
            const element = document.body;
            const opt = {
                margin:       0.5,
                filename:     'CV_Kevin_DIDIER.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
            console.log("clicked !");
            });
            }; // 500ms suffisent dans la plupart des cas

        loadAllSections();

        </script>
    </body>
</html>
